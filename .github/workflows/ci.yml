name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-folder:
    name: xLights show folder
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # validator.py documents Python 3.7+; cover the oldest version the
        # runners still provide through to current.
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify the show folder matches its spec and channel map
        run: python3 tools/xlights_layers.py verify

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Check that `apply` is idempotent
        # Re-running the generator must leave the committed zip byte-identical.
        # If it does not, the zip and the spec have drifted apart.
        run: |
          python3 tools/xlights_layers.py apply
          git diff --exit-code -- xlights/

      - name: Check the validator still imports and rejects a bad file
        run: |
          python3 -c "
          import validator, io, sys
          try:
              validator.validate(io.BytesIO(b'NOPE' + bytes(32)))
          except validator.ValidationError:
              print('validator rejects malformed input as expected')
              sys.exit(0)
          sys.exit('validator accepted a malformed file')
          "

      - name: Check the channel-count message still explains itself
        # Issue #65: the vehicle only says "Incorrect number of channels".
        # The message here has to name the cause, and stay tied to the show
        # folder it describes.
        run: |
          python3 -c "
          import struct, xml.etree.ElementTree as ET, zipfile, io, sys
          import validator

          with zipfile.ZipFile('xlights/tesla_xlights_cross_vehicle_folder.zip') as z:
              root = ET.fromstring(z.read('tesla_xlights_cross_vehicle_folder/xlights_networks.xml'))
          total = sum(int(n.get('MaxChannels', 0))
                      for c in root.findall('Controller')
                      for n in c.findall('network'))

          header = bytearray(32)
          header[0:4] = b'PSEQ'
          struct.pack_into('<H', header, 4, 32)
          header[7] = 2
          struct.pack_into('<IIB', header, 10, total, 10, 20)
          try:
              validator.validate(io.BytesIO(bytes(header) + bytes(total * 10)))
          except validator.ValidationError as error:
              message = str(error)
          else:
              sys.exit('validator accepted a %d-channel file' % total)

          assert validator.VEHICLE_ERROR in message, message
          assert 'cross-vehicle' in message, message
          print('a %d-channel export is explained as %d cars' % (total, total // 200))
          "

  example-shows:
    name: Analyse the shipped example shows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Report every example show on every vehicle
        # Exercises the CLI end to end. The examples are expected to produce
        # findings, so --strict is deliberately not used here; the step fails
        # only if the tool cannot read or analyse a show.
        run: |
          set -euo pipefail
          mkdir -p _examples
          for archive in examples/*.zip; do
            unzip -o -q "$archive" -d _examples
          done
          found=0
          while IFS= read -r show; do
            found=$((found + 1))
            echo "::group::$show"
            python3 tools/vehicle_preview.py "$show"
            echo "::endgroup::"
          done < <(find examples _examples -name '*.fseq' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No example .fseq files were found" >&2
            exit 1
          fi
          echo "Analysed $found example show(s)."

      - name: Check the shipped show folders extract to usable projects
        # Issue #75: "the file doesn't show up" is often the folder given to
        # xLights, so the folders this repository ships have to survive a
        # plain unzip and be recognisable afterwards.
        run: |
          set -euo pipefail
          rm -rf _folders && mkdir -p _folders
          python3 -c "
          import zipfile
          for name in ('tesla_xlights_show_folder',
                       'tesla_xlights_cross_vehicle_folder'):
              with zipfile.ZipFile('xlights/%s.zip' % name) as bundle:
                  bundle.extractall('_folders/%s' % name)
          "
          python3 tools/show_folder_check.py             _folders/tesla_xlights_show_folder/tesla_xlights_show_folder -v
          python3 tools/show_folder_check.py             _folders/tesla_xlights_cross_vehicle_folder/tesla_xlights_cross_vehicle_folder -v
          # Pointing at the extraction parent must be guided down, not accepted.
          if python3 tools/show_folder_check.py _folders/tesla_xlights_show_folder > /dev/null; then
            echo "expected the extraction parent to be rejected" >&2
            exit 1
          fi
          echo "show folders extract and are recognised."

      - name: Build a channel probe and check it is playable
        # Issue #72: the probe is how an owner answers a mapping question on
        # their own car, so the show it writes has to be one the car accepts.
        run: |
          set -euo pipefail
          rm -rf _probe && mkdir -p _probe/LightShow
          python3 tools/channel_probe.py _probe/LightShow/probe --group headlights
          # Issue #76: a turn that drives two channels at once must still
          # produce a show the car accepts.
          python3 tools/channel_probe.py _probe/pair --channels 13,17,13+17
          # Not --strict: the runner's own filesystem is not exFAT, and that
          # says nothing about whether the probe is a playable show.
          python3 tools/usb_check.py _probe
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          import validator
          with open('_probe/LightShow/probe.fseq', 'rb') as handle:
              results = validator.validate(handle)
          print('probe validates:', results)
          "

      - name: Check every shipped xLights sequence
        # Issue #66: a sequence with no timing marks is the state that
        # produces the "Graphics Driver Problem" dialog. None of the shipped
        # sequences should be in it.
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r sequence; do
            found=$((found + 1))
            echo "::group::$sequence"
            python3 tools/sequence_check.py "$sequence" -v
            echo "::endgroup::"
          done < <(find examples -name '*.xsq' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No .xsq sequences were found" >&2
            exit 1
          fi
          echo "Checked $found sequence(s)."

      - name: Check the documentation's links
        # Issue #62: the community show list grows by request, so its shape is
        # checked mechanically. Nothing here touches the network.
        run: python3 tools/docs_check.py -v

      - name: Check the vehicle list against the README
        # Issue #52: the supported-vehicle list has one home. Adding a vehicle
        # means editing the README and adding a profile in the same change.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          lines = open("README.md").read().splitlines()
          start = next(i for i, l in enumerate(lines)
                       if l.startswith("#") and "Supported Vehicles" in l)
          bullets = []
          for line in lines[start + 1:]:
              if line.startswith("#"):
                  break
              if line.startswith("- "):
                  bullets.append(line[2:].strip())

          vehicles = [b for b in bullets if not b.startswith("Running Software")]
          labels = sorted(p.label for p in vp.VEHICLES.values())
          assert sorted(vehicles) == labels, (vehicles, labels)
          assert any(b.startswith("Running Software") for b in bullets)
          print("README and vehicle_preview agree on:", ", ".join(labels))

          for profile in vp.VEHICLES.values():
              for variant in profile.variants:
                  assert variant.readme in open("README.md").read(), variant.key
                  print("build variant {} cites README '{}'".format(
                      variant.key, variant.readme))
          PYEOF

      - name: Report what every example does with the interior lights
        # Issue #49: the cabin channels only exist in a 200-channel export, so
        # the examples must cover both "cannot reach them" and "drives them".
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          reached, lit = 0, 0
          paths = sorted(glob.glob("examples/**/*.fseq", recursive=True) +
                         glob.glob("_examples/**/*.fseq", recursive=True))
          for path in paths:
              show = vp.read_fseq(path)
              usage = vp.interior_usage(show)
              codes = [f.code for f in vp.analyze_interior(show)]
              if usage:
                  reached += 1
                  if any(u.lit for u in usage):
                      lit += 1
              else:
                  assert codes == ["interior-not-in-export"], (path, codes)
              print("{:70s} {:3d}ch  {}".format(
                  path[-70:], show.channel_count, ", ".join(codes) or "cabin fully driven"))
          assert paths, "no example shows were found"
          assert reached, "no example can reach the interior channels"
          assert lit, "no example drives the interior lights"
          print("{} show(s) can reach the cabin, {} drive it.".format(reached, lit))
          PYEOF

      - name: Check the examples table still matches examples/
        # Issue #87: the table in README.md is generated, so it cannot be
        # allowed to drift from the archives it describes.
        run: |
          set -euo pipefail
          python3 tools/examples_index.py
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "tools")
          import examples_index as ei
          readme = open("README.md", encoding="utf-8").read()
          missing = [line for line in ei.render_markdown(ei.collect()).splitlines()
                     if line not in readme]
          if missing:
              print("README.md is out of date; regenerate the table:", file=sys.stderr)
              for line in missing:
                  print("  " + line, file=sys.stderr)
              sys.exit(1)
          print("README examples table matches examples/.")
          PYEOF

      - name: Report how much of each example each vehicle can show
        # Issue #82: "the show never started" is often a show written for a
        # different car. This prints the share rather than failing on it.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp
          seen = set()
          for path in sorted(glob.glob("examples/**/*.fseq", recursive=True)):
              label = path.split("/")[1]
              if label in seen:
                  continue
              seen.add(label)
              show = vp.read_fseq(path)
              shares = []
              for key in ("models", "model3", "cybertruck"):
                  spread = vp.coverage(show, vp.VEHICLES[key])
                  pct = 100 * spread.fitted / spread.total if spread.total else 0
                  shares.append("%s %.0f%%" % (key, pct))
              print("{:46s} {}".format(label[:46], "  ".join(shares)))
          PYEOF

      - name: Export a shipped show and check every row decodes
        # Issue #79: the exporter is how someone reads a .fseq they were
        # given. Every value it prints has to name a documented effect.
        run: |
          set -euo pipefail
          python3 tools/fseq_export.py \
            "examples/lightshow_example_5_Cyber_Symphony_4_Car/Car #1/LightShow/lightshow.fseq" \
            --channels 41,46
          python3 - <<'PYEOF'
          import csv, io, subprocess, sys
          sys.path.insert(0, "tools")
          import fseq_export as fx, vehicle_preview as vp
          show = vp.read_fseq("examples/lightshow_example_3_The_Arrival_5_Car/Car #1/LightShow/lightshow.fseq")
          rows = fx.export(show)
          assert rows, "the exporter produced nothing"
          for row in rows:
              assert row["effect"], row
          print("%d row(s) exported, every one decoded." % len(rows))
          PYEOF

      - name: Report when each example first lights up
        # Issue #78: "the lights start late" needs a measurement to argue
        # with. Leading darkness is normal -- The Arrival opens with 5.3 s of
        # it -- so this is printed, never failed on.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp
          for path in sorted(glob.glob("examples/**/*.fseq", recursive=True)):
              show = vp.read_fseq(path)
              first = show.first_lit_ms()
              print("{:64s} first light {}".format(
                  path[-64:], "never" if first is None else "%d ms" % first))
          PYEOF

      - name: Report Model X pinch risk in every example
        # Issue #77: a window moving while a Model X door is still moving can
        # stop the show. The two older examples do it; this step keeps that
        # visible rather than letting it drift unnoticed.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys, zipfile, tempfile, os, io
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          def shows():
              for archive in sorted(glob.glob("examples/*.zip")):
                  with zipfile.ZipFile(archive) as bundle:
                      for member in bundle.namelist():
                          if member.lower().endswith(".fseq"):
                              handle = tempfile.NamedTemporaryFile(
                                  suffix=".fseq", delete=False)
                              handle.write(bundle.read(member))
                              handle.close()
                              yield archive, vp.read_fseq(handle.name)
                              os.unlink(handle.name)
              for path in sorted(glob.glob("examples/**/*.fseq", recursive=True)):
                  yield path, vp.read_fseq(path)

          tripped = 0
          for name, show in shows():
              findings = [f for f in vp.analyze(show, vp.VEHICLES["modelx"])
                          if f.code == "window-during-door-movement"]
              if findings:
                  tripped += 1
                  print("{:62s} {}".format(name[-62:], findings[0].summary))
          print("%d shipped show(s) can stop early on a Model X." % tripped)
          PYEOF

      - name: Report the closure command budget of every example
        # Issue #50: the per-closure actuation limits are still real. This
        # also guards the counting rule -- if commands were counted per frame
        # rather than per effect, these numbers would be in the hundreds.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          spent = 0
          for path in sorted(glob.glob("examples/**/*.fseq", recursive=True) +
                             glob.glob("_examples/**/*.fseq", recursive=True)):
              show = vp.read_fseq(path)
              for entry in vp.closure_usage(show):
                  spent += entry.count
                  assert entry.count <= entry.family.limit + 2, (
                      path, vp.channel_name(entry.channel), entry.count,
                      entry.family.limit)
              codes = sorted({f.code for f in vp.analyze_closures(show)})
              print("{:66s} {}".format(path[-66:], ", ".join(codes) or "within budget"))
          assert spent, "no example spends a closure command"
          print("{} closure command(s) counted across the examples.".format(spent))
          PYEOF

      - name: Check every shipped cross-vehicle show
        # Issue #64: the cars in a set have to agree. This also guards the
        # rule that they may differ in frame interval but not in length --
        # "The Arrival" mixes 25 ms and 50 ms cars deliberately.
        run: |
          set -euo pipefail
          found=0
          for show in examples/*/; do
            if ! compgen -G "$show*/LightShow" > /dev/null; then continue; fi
            found=$((found + 1))
            echo "::group::$show"
            python3 tools/multi_car_check.py "$show" -v --strict
            echo "::endgroup::"
          done
          if [ "$found" -lt 3 ]; then
            echo "Expected at least three cross-vehicle example sets, found $found" >&2
            exit 1
          fi
          echo "Checked $found cross-vehicle show(s)."

      - name: Check a multi-show USB layout end to end
        # Builds the layout issue #48 asked for -- several shows side by side
        # in one LightShow folder -- out of the shipped examples, and asserts
        # the tool lists all of them.
        run: |
          set -euo pipefail
          rm -rf _drive && mkdir -p _drive/LightShow
          count=0
          while IFS= read -r show; do
            dir=$(dirname "$show")
            audio=$(find "$dir" -maxdepth 1 \( -name '*.wav' -o -name '*.mp3' \) | sort | head -1)
            if [ -z "$audio" ]; then continue; fi
            count=$((count + 1))
            cp "$show" "_drive/LightShow/show-$count.fseq"
            cp "$audio" "_drive/LightShow/show-$count.${audio##*.}"
            if [ "$count" -ge 3 ]; then break; fi
          done < <(find examples _examples -name '*.fseq' | sort)
          if [ "$count" -lt 2 ]; then
            echo "Need at least two example shows to build a multi-show drive" >&2
            exit 1
          fi
          python3 tools/usb_check.py _drive -v
          python3 tools/usb_check.py _drive --json | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          assert report['playable_show_count'] == $count, report
          print('picker lists', report['playable_show_count'], 'shows')
          "

      - name: Check that a broken layout is rejected
        # The subfolder-per-show layout from issue #48 must exit non-zero.
        run: |
          set -euo pipefail
          rm -rf _baddrive && mkdir -p _baddrive/LightShow/show1
          cp _drive/LightShow/show-1.fseq _baddrive/LightShow/show1/
          if python3 tools/usb_check.py _baddrive; then
            echo "usb_check accepted a layout the car cannot read" >&2
            exit 1
          fi
          echo "usb_check rejected the subfolder layout as expected."
