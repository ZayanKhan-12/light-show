name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-folder:
    name: xLights show folder
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # validator.py documents Python 3.7+; cover the oldest version the
        # runners still provide through to current.
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify the show folder matches its spec and channel map
        run: python3 tools/xlights_layers.py verify

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Check that `apply` is idempotent
        # Re-running the generator must leave the committed zip byte-identical.
        # If it does not, the zip and the spec have drifted apart.
        run: |
          python3 tools/xlights_layers.py apply
          git diff --exit-code -- xlights/

      - name: Check the validator still imports and rejects a bad file
        run: |
          python3 -c "
          import validator, io, sys
          try:
              validator.validate(io.BytesIO(b'NOPE' + bytes(32)))
          except validator.ValidationError:
              print('validator rejects malformed input as expected')
              sys.exit(0)
          sys.exit('validator accepted a malformed file')
          "

  example-shows:
    name: Analyse the shipped example shows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Report every example show on every vehicle
        # Exercises the CLI end to end. The examples are expected to produce
        # findings, so --strict is deliberately not used here; the step fails
        # only if the tool cannot read or analyse a show.
        run: |
          set -euo pipefail
          mkdir -p _examples
          for archive in examples/*.zip; do
            unzip -o -q "$archive" -d _examples
          done
          found=0
          while IFS= read -r show; do
            found=$((found + 1))
            echo "::group::$show"
            python3 tools/vehicle_preview.py "$show"
            echo "::endgroup::"
          done < <(find examples _examples -name '*.fseq' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No example .fseq files were found" >&2
            exit 1
          fi
          echo "Analysed $found example show(s)."

      - name: Check the documentation's links
        # Issue #62: the community show list grows by request, so its shape is
        # checked mechanically. Nothing here touches the network.
        run: python3 tools/docs_check.py -v

      - name: Check the vehicle list against the README
        # Issue #52: the supported-vehicle list has one home. Adding a vehicle
        # means editing the README and adding a profile in the same change.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          lines = open("README.md").read().splitlines()
          start = next(i for i, l in enumerate(lines)
                       if l.startswith("#") and "Supported Vehicles" in l)
          bullets = []
          for line in lines[start + 1:]:
              if line.startswith("#"):
                  break
              if line.startswith("- "):
                  bullets.append(line[2:].strip())

          vehicles = [b for b in bullets if not b.startswith("Running Software")]
          labels = sorted(p.label for p in vp.VEHICLES.values())
          assert sorted(vehicles) == labels, (vehicles, labels)
          assert any(b.startswith("Running Software") for b in bullets)
          print("README and vehicle_preview agree on:", ", ".join(labels))

          for profile in vp.VEHICLES.values():
              for variant in profile.variants:
                  assert variant.readme in open("README.md").read(), variant.key
                  print("build variant {} cites README '{}'".format(
                      variant.key, variant.readme))
          PYEOF

      - name: Report what every example does with the interior lights
        # Issue #49: the cabin channels only exist in a 200-channel export, so
        # the examples must cover both "cannot reach them" and "drives them".
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          reached, lit = 0, 0
          paths = sorted(glob.glob("examples/**/*.fseq", recursive=True) +
                         glob.glob("_examples/**/*.fseq", recursive=True))
          for path in paths:
              show = vp.read_fseq(path)
              usage = vp.interior_usage(show)
              codes = [f.code for f in vp.analyze_interior(show)]
              if usage:
                  reached += 1
                  if any(u.lit for u in usage):
                      lit += 1
              else:
                  assert codes == ["interior-not-in-export"], (path, codes)
              print("{:70s} {:3d}ch  {}".format(
                  path[-70:], show.channel_count, ", ".join(codes) or "cabin fully driven"))
          assert paths, "no example shows were found"
          assert reached, "no example can reach the interior channels"
          assert lit, "no example drives the interior lights"
          print("{} show(s) can reach the cabin, {} drive it.".format(reached, lit))
          PYEOF

      - name: Report the closure command budget of every example
        # Issue #50: the per-closure actuation limits are still real. This
        # also guards the counting rule -- if commands were counted per frame
        # rather than per effect, these numbers would be in the hundreds.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys
          sys.path.insert(0, "tools")
          import vehicle_preview as vp

          spent = 0
          for path in sorted(glob.glob("examples/**/*.fseq", recursive=True) +
                             glob.glob("_examples/**/*.fseq", recursive=True)):
              show = vp.read_fseq(path)
              for entry in vp.closure_usage(show):
                  spent += entry.count
                  assert entry.count <= entry.family.limit + 2, (
                      path, vp.channel_name(entry.channel), entry.count,
                      entry.family.limit)
              codes = sorted({f.code for f in vp.analyze_closures(show)})
              print("{:66s} {}".format(path[-66:], ", ".join(codes) or "within budget"))
          assert spent, "no example spends a closure command"
          print("{} closure command(s) counted across the examples.".format(spent))
          PYEOF

      - name: Check every shipped cross-vehicle show
        # Issue #64: the cars in a set have to agree. This also guards the
        # rule that they may differ in frame interval but not in length --
        # "The Arrival" mixes 25 ms and 50 ms cars deliberately.
        run: |
          set -euo pipefail
          found=0
          for show in examples/*/; do
            if ! compgen -G "$show*/LightShow" > /dev/null; then continue; fi
            found=$((found + 1))
            echo "::group::$show"
            python3 tools/multi_car_check.py "$show" -v --strict
            echo "::endgroup::"
          done
          if [ "$found" -lt 3 ]; then
            echo "Expected at least three cross-vehicle example sets, found $found" >&2
            exit 1
          fi
          echo "Checked $found cross-vehicle show(s)."

      - name: Check a multi-show USB layout end to end
        # Builds the layout issue #48 asked for -- several shows side by side
        # in one LightShow folder -- out of the shipped examples, and asserts
        # the tool lists all of them.
        run: |
          set -euo pipefail
          rm -rf _drive && mkdir -p _drive/LightShow
          count=0
          while IFS= read -r show; do
            dir=$(dirname "$show")
            audio=$(find "$dir" -maxdepth 1 \( -name '*.wav' -o -name '*.mp3' \) | sort | head -1)
            if [ -z "$audio" ]; then continue; fi
            count=$((count + 1))
            cp "$show" "_drive/LightShow/show-$count.fseq"
            cp "$audio" "_drive/LightShow/show-$count.${audio##*.}"
            if [ "$count" -ge 3 ]; then break; fi
          done < <(find examples _examples -name '*.fseq' | sort)
          if [ "$count" -lt 2 ]; then
            echo "Need at least two example shows to build a multi-show drive" >&2
            exit 1
          fi
          python3 tools/usb_check.py _drive -v
          python3 tools/usb_check.py _drive --json | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          assert report['playable_show_count'] == $count, report
          print('picker lists', report['playable_show_count'], 'shows')
          "

      - name: Check that a broken layout is rejected
        # The subfolder-per-show layout from issue #48 must exit non-zero.
        run: |
          set -euo pipefail
          rm -rf _baddrive && mkdir -p _baddrive/LightShow/show1
          cp _drive/LightShow/show-1.fseq _baddrive/LightShow/show1/
          if python3 tools/usb_check.py _baddrive; then
            echo "usb_check accepted a layout the car cannot read" >&2
            exit 1
          fi
          echo "usb_check rejected the subfolder layout as expected."
